name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test, Clippy & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio and windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev pkg-config

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit and integration tests
        run: cargo test

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Build documentation with warnings as errors
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps
