[package]
name = "kotodama"
version = "0.1.1"
edition = "2024"
license = "MPL-2.0"
description = "A local-first, gamified Japanese pronunciation and pitch-accent trainer powered by Anki and FSRS."
repository = "https://github.com/Daniel-McLarty/kotodama"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
iced = { version = "0.14.0", features = ["canvas", "tokio"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
rodio = "0.23.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "ogg", "vorbis", "pcm", "wav", "flac", "aac", "isomp4"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
ureq = { version = "3.5.2", features = ["json"] }
