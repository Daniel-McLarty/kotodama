[package]
name = "kotodama"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "A local-first, gamified Japanese pronunciation and pitch-accent trainer powered by Anki and FSRS."
repository = "https://github.com/Daniel-McLarty/kotodama"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
iced = { version = "0.14.0", features = ["canvas"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
